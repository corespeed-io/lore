name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests and quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-bookworm
        env:
          POSTGRES_DB: lore_memory_core_smoke_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lore_memory_core_smoke_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-
      - run: bun install --frozen-lockfile
      - name: Cache Vitest modules
        uses: actions/cache@v5
        with:
          path: node_modules/.experimental-vitest-cache
          key: ${{ runner.os }}-node24-vitest-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-node24-vitest-${{ hashFiles('bun.lock') }}-
      - run: bun run lint
      - run: bun run architecture:check
      - run: bun run design:check
      - run: bun run typecheck
      - run: bun run service:test
      - run: bun audit --audit-level=high
      - run: bunx vitest run
      - run: bun run --cwd packages/lore-core check
      - run: bun run smoke:memory-core
        env:
          LORE_SMOKE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lore_memory_core_smoke_ci

  build:
    name: Build and packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-
      - run: bun install --frozen-lockfile
      - name: Cache Next build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node24-next-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-node24-next-${{ hashFiles('bun.lock') }}-
      # npm pack runs each package's existing prepack build before installation.
      - run: bun run packages:smoke
      - name: Build the Node application
        run: bunx next build
      - run: bun run build:maintenance
      - run: bun run build:dbmate
      # Reuse this job's fresh standalone Next output; still build the Worker bundle.
      - name: Build the Cloudflare Worker
        run: bunx opennextjs-cloudflare build --skipNextBuild
      - run: bunx wrangler deploy --dry-run

  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ./packages/python-sdk
      - run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s packages/python-sdk/tests

  check:
    if: ${{ always() }}
    needs: [tests, build, python-sdk]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
