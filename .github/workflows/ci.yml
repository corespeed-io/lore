name: ci
on: [push, pull_request]
jobs:
  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ./packages/python-sdk
      - run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s packages/python-sdk/tests
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-bookworm
        env:
          POSTGRES_DB: lore_memory_core_smoke_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lore_memory_core_smoke_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run design:check
      - run: bun run typecheck
      - run: bun run service:test
      - run: bun run test
      - run: bun run smoke:memory-core
        env:
          LORE_SMOKE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lore_memory_core_smoke_ci
      - run: bun run packages:smoke
      - run: bun run build
      - run: bun audit --audit-level=high
      - run: bunx opennextjs-cloudflare build
      - run: bunx wrangler deploy --dry-run
