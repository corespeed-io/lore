name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Lint, typecheck & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-bookworm
        env:
          POSTGRES_DB: lore_memory_core_smoke_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lore_memory_core_smoke_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Vitest modules
        uses: actions/cache@v5
        with:
          path: node_modules/.experimental-vitest-cache
          key: ${{ runner.os }}-bun1.3.14-vitest-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-bun1.3.14-vitest-${{ hashFiles('bun.lock') }}-
      - name: Check formatting and lint
        run: bun run lint
      - name: Check module dependency boundaries
        run: bun run architecture:check
      - name: Check UI conventions
        run: bun run design:check
      - name: Check TypeScript types
        run: bun run typecheck
      - name: Test local service scripts
        run: bun run service:test
      - name: Audit dependency vulnerabilities
        run: bun audit --audit-level=high
      - name: Run application tests
        run: bun --no-env-file --bun vitest run
      - name: Run Core typecheck and tests
        run: bun run --cwd packages/lore-core check
      - name: Run PostgreSQL memory smoke test
        run: bun run smoke:memory-core
        env:
          LORE_SMOKE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lore_memory_core_smoke_ci

  build:
    name: Build web, SDK, CLI & MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.14-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Cache Next build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun1.3.14-next-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun1.3.14-next-${{ hashFiles('bun.lock') }}-
      # bun pm pack runs each package's existing prepack build before installation.
      - name: Build and test SDK, CLI and MCP packages
        run: bun run packages:smoke
      - name: Build Next.js application
        run: bun --bun next build
      - name: Smoke test Bun Next.js server and Hono API
        run: bun run smoke:next
      - name: Build maintenance worker
        run: bun run build:maintenance
      - name: Bundle database migration tool
        run: bun run build:dbmate
      # Reuse this job's fresh standalone Next output; still build the Worker bundle.
      - name: Build Cloudflare Worker
        run: bun --bun opennextjs-cloudflare build --skipNextBuild
      - name: Validate Cloudflare deployment (dry run)
        run: bun --bun wrangler deploy --dry-run

  check:
    name: All checks
    if: ${{ always() }}
    needs: [tests, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
