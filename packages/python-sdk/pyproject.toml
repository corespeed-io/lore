[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corespeed-lore-sdk"
version = "0.1.0"
description = "Python SDK for the Lore portable memory API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CoreSpeed" }]
dependencies = ["typing-extensions>=4.12; python_version < '3.11'"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/corespeed-io/lore"
Issues = "https://github.com/corespeed-io/lore/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
corespeed_lore = ["py.typed"]
