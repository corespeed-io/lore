services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    environment:
      POSTGRES_DB: lore
      POSTGRES_USER: lore_admin
      POSTGRES_PASSWORD: ${LORE_DB_ADMIN_PASSWORD:?Set LORE_DB_ADMIN_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lore_admin -d lore"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - lore-postgres:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["sh", "-c", "bun scripts/migrate.ts && node scripts/create-runtime-role.mjs"]
    environment:
      DATABASE_URL: postgres://lore_admin:${LORE_DB_ADMIN_PASSWORD:?Set LORE_DB_ADMIN_PASSWORD in .env}@postgres:5432/lore
      LORE_RUNTIME_ROLE: lore_runtime
      LORE_RUNTIME_PASSWORD: ${LORE_DB_RUNTIME_PASSWORD:?Set LORE_DB_RUNTIME_PASSWORD in .env}
      LORE_MAINTENANCE_ROLE: lore_maintenance_runtime
      LORE_MAINTENANCE_PASSWORD: ${LORE_DB_MAINTENANCE_PASSWORD:?Set LORE_DB_MAINTENANCE_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  lore:
    build: .
    ports:
      - "${LORE_BIND_ADDRESS:-127.0.0.1}:${LORE_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://lore_runtime:${LORE_DB_RUNTIME_PASSWORD:?Set LORE_DB_RUNTIME_PASSWORD in .env}@postgres:5432/lore
      AUTH_MODE: ${AUTH_MODE:-none}
      ALLOW_INSECURE: ${ALLOW_INSECURE:-1}
      UI_PASSWORD: ${UI_PASSWORD:-}
      ACCESS_TEAM_DOMAIN: ${ACCESS_TEAM_DOMAIN:-}
      ACCESS_AUD: ${ACCESS_AUD:-}
      LORE_LOCAL_SUBJECT: ${LORE_LOCAL_SUBJECT:-local}
      LORE_LOCAL_DISPLAY_NAME: ${LORE_LOCAL_DISPLAY_NAME:-Local User}
      LORE_LOCAL_EMAIL: ${LORE_LOCAL_EMAIL:-}
      APP_TITLE: ${APP_TITLE:-Memory for humans and agents}
      APP_SUBTITLE: ${APP_SUBTITLE:-Durable recall inside a database-enforced boundary.}
      LORE_EMBEDDING_PROVIDER: ${LORE_EMBEDDING_PROVIDER:-ollama}
      LORE_EMBEDDING_MODEL: ${LORE_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${LORE_DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-0}
      LORE_EMBEDDING_TIMEOUT_MS: ${LORE_EMBEDDING_TIMEOUT_MS:-120000}
      LORE_SEMANTIC_DISTANCE_THRESHOLD: ${LORE_SEMANTIC_DISTANCE_THRESHOLD:-0.5}
      LORE_ENTITY_ALIAS_RECALL: ${LORE_ENTITY_ALIAS_RECALL:-0}
      LORE_EVIDENCE_NEIGHBOR_CHUNKS: ${LORE_EVIDENCE_NEIGHBOR_CHUNKS:-0}
      LORE_EVIDENCE_TOP_CHUNKS: ${LORE_EVIDENCE_TOP_CHUNKS:-1}
      LORE_RETRIEVAL_FEEDBACK_QUERIES: ${LORE_RETRIEVAL_FEEDBACK_QUERIES:-0}
      LORE_RETRIEVAL_RECENCY_WEIGHT: ${LORE_RETRIEVAL_RECENCY_WEIGHT:-0}
      LORE_RERANK_PROVIDER: ${LORE_RERANK_PROVIDER:-}
      LORE_RERANK_MODEL: ${LORE_RERANK_MODEL:-}
      LORE_RERANK_BASE_URL: ${LORE_DOCKER_RERANK_BASE_URL:-}
      LORE_RERANK_API_KEY: ${LORE_RERANK_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      MEMOS_API_KEY: ${MEMOS_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      LORE_RERANK_TIMEOUT_MS: ${LORE_RERANK_TIMEOUT_MS:-30000}
      LORE_RERANK_CANDIDATE_LIMIT: ${LORE_RERANK_CANDIDATE_LIMIT:-50}
      LORE_RERANK_MIN_SCORE: ${LORE_RERANK_MIN_SCORE:-}
      LORE_RERANK_DIVERSITY_LAMBDA: ${LORE_RERANK_DIVERSITY_LAMBDA:-}
      LORE_RERANK_WEIGHT: ${LORE_RERANK_WEIGHT:-}
      LORE_RERANK_INSTRUCTION: ${LORE_RERANK_INSTRUCTION:-}
      LORE_RERANK_NUM_CTX: ${LORE_RERANK_NUM_CTX:-8192}
      LORE_RERANK_MAX_OUTPUT_TOKENS: ${LORE_RERANK_MAX_OUTPUT_TOKENS:-2048}
      LORE_RERANK_MAX_DOCUMENT_CHARS: ${LORE_RERANK_MAX_DOCUMENT_CHARS:-600}
      LORE_RERANK_KEEP_ALIVE: ${LORE_RERANK_KEEP_ALIVE:-0}
      LORE_QUERY_PLANNER_PROVIDER: ${LORE_QUERY_PLANNER_PROVIDER:-}
      LORE_QUERY_PLANNER_MODEL: ${LORE_QUERY_PLANNER_MODEL:-}
      LORE_QUERY_PLANNER_BASE_URL: ${LORE_DOCKER_QUERY_PLANNER_BASE_URL:-}
      LORE_QUERY_PLANNER_API_KEY: ${LORE_QUERY_PLANNER_API_KEY:-}
      LORE_QUERY_PLANNER_TIMEOUT_MS: ${LORE_QUERY_PLANNER_TIMEOUT_MS:-30000}
      LORE_QUERY_PLANNER_MAX_QUERIES: ${LORE_QUERY_PLANNER_MAX_QUERIES:-3}
      LORE_QUERY_PLANNER_INSTRUCTION: ${LORE_QUERY_PLANNER_INSTRUCTION:-}
      LORE_QUERY_PLANNER_KEEP_ALIVE: ${LORE_QUERY_PLANNER_KEEP_ALIVE:-0}
      LORE_QUERY_PLANNER_NUM_CTX: ${LORE_QUERY_PLANNER_NUM_CTX:-4096}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  maintenance:
    build: .
    command: ["node", ".worker/maintenance-worker.js"]
    environment:
      LORE_MAINTENANCE_DATABASE_URL: postgres://lore_maintenance_runtime:${LORE_DB_MAINTENANCE_PASSWORD:?Set LORE_DB_MAINTENANCE_PASSWORD in .env}@postgres:5432/lore
      LORE_MAINTENANCE_POOL_SIZE: ${LORE_MAINTENANCE_POOL_SIZE:-2}
      LORE_MAINTENANCE_CONCURRENCY: ${LORE_MAINTENANCE_CONCURRENCY:-1}
      LORE_MAINTENANCE_POLL_MS: ${LORE_MAINTENANCE_POLL_MS:-1000}
      LORE_MAINTENANCE_SWEEP_MS: ${LORE_MAINTENANCE_SWEEP_MS:-300000}
      LORE_EMBEDDING_ROLLBACK_SECONDS: ${LORE_EMBEDDING_ROLLBACK_SECONDS:-604800}
      LORE_EMBEDDING_PROVIDER: ${LORE_EMBEDDING_PROVIDER:-ollama}
      LORE_EMBEDDING_MODEL: ${LORE_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      LORE_EMBEDDING_BUILD_PROVIDER: ${LORE_EMBEDDING_BUILD_PROVIDER:-}
      LORE_EMBEDDING_BUILD_MODEL: ${LORE_EMBEDDING_BUILD_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${LORE_DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-0}
      LORE_EMBEDDING_TIMEOUT_MS: ${LORE_EMBEDDING_TIMEOUT_MS:-120000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  lore-postgres:
